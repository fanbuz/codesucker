name: Package and Release
run-name: ${{ github.event_name == 'push' && format('Release {0}', github.ref_name) || format('Test packages {0}', github.ref_name) }}

on:
  # 日常 PR 由 ci.yml 验证；需要安装包时显式手动触发。
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  # 手动测试包与正式发布相互隔离；同一 ref 的手动重复运行只保留最新一次。
  group: package-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm

      - name: Check tag, product version, and changelog
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: npm run release:check -- "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Check versions, test, and build
        run: npm run verify

  package:
    name: Package ${{ matrix.label }}
    # verify 已包含许可证检查，避免为同一提交重复安装依赖和校验。
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS x64
            runner: macos-14
            script: dist:mac:x64
            artifact: codesucker-macos-x64
            path: packages/app/release/CodeSucker-*-mac-x64.dmg
          - label: macOS arm64
            runner: macos-14
            script: dist:mac:arm64
            artifact: codesucker-macos-arm64
            path: packages/app/release/CodeSucker-*-mac-arm64.dmg
          - label: Windows x64
            runner: windows-2022
            script: dist:win:x64
            artifact: codesucker-windows-x64
            path: packages/app/release/CodeSucker-*-win-x64.exe
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run ${{ matrix.script }}

      - name: Smoke test Windows application
        if: matrix.label == 'Windows x64'
        shell: pwsh
        run: |
          $executable = Resolve-Path 'packages/app/release/win-unpacked/CodeSucker.exe'
          try {
            $process = Start-Process -FilePath $executable.Path -PassThru
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) {
              throw "CodeSucker exited during the startup smoke test with code $($process.ExitCode)"
            }
          } finally {
            Get-Process CodeSucker -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 3 || 7 }}

  release:
    name: Publish GitHub Release
    # 即使手动选择版本 tag，也只生成测试包，不能创建 Release。
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: codesucker-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum CodeSucker-* > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_options=()
          version_without_build="${GITHUB_REF_NAME%%+*}"
          if [[ "$version_without_build" == *-* ]]; then
            release_options+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --title "CodeSucker $GITHUB_REF_NAME" \
            --generate-notes \
            --notes $'### 安装与处理边界\n\n当前 macOS 安装包尚未进行 Apple Developer ID 签名与公证。请只从本项目 Release 下载并先核对 SHA-256；如首次打开被 Gatekeeper 拦截，请在“系统设置 → 隐私与安全性”中选择“仍要打开”。详细处理方式见 README。\n\nCodeSucker 自身的源码扫描、第三方代码线索分析、清洗、分页、校验和导出全部在本机运行，不调用任何本地或云端 LLM，也不向模型服务发送源码。第三方代码线索只提供启发式证据与筛选建议，不自动判定代码归属，也不构成法律意见。更新检测仅查询 GitHub Release 公开版本元数据。' \
            "${release_options[@]}"
